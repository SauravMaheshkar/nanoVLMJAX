[project]
name = "nanoVLMJAX"
version = "0.0.1"
requires-python = ">=3.11"
dependencies = [
    "jax==0.8.1",
]

[dependency-groups]
dev = [
    "pre-commit>=4.2.0",
    "pytest>=8.4.0",
    "ruff>=0.11.13",
]

[tool.pytest.ini_options]
pythonpath = ["."]
testpaths = ["tests"]
python_functions = [
    "test_*",
    "illustrate_*"
]
