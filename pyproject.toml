[project]
name = "nanoVLMJAX"
version = "0.0.1"
requires-python = ">=3.11"
dependencies = [
    "datasets>=4.8.4",
    "grain>=0.2.16",
    "jax==0.8.1",
    "jaxtyping>=0.3.5",
    "optax>=0.2.0",
    "pillow>=10.0.0",
    "transformers>=5.5.4",
]

[project.optional-dependencies]
hub = [
    "huggingface-hub>=0.32.4",
    "safetensors>=0.5.2",
    "torch>=2.0.0",
]
dev = [
    "pre-commit>=4.2.0",
    "ruff>=0.11.13",
]
test = [
    "pytest>=8.4.0",
    "pytest-xdist>=3.6.0",
]

[tool.ruff.lint]
select = ["E", "F", "I001"]
ignore = ["F722"]

[tool.pytest.ini_options]
pythonpath = ["."]
testpaths = ["tests"]
python_functions = [
    "test_*",
    "illustrate_*"
]
addopts = [
    "-p", "no:faulthandler",
    "--tb=short",
    "--maxfail=1",
]
markers = [
    "local: marks tests that are too heavy for CI (e.g. real data loaders, large models)",
]
